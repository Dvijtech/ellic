#VRML_SIM R2023b utf8

EXTERNPROTO "Frame.proto"
EXTERNPROTO "Crank.proto"
EXTERNPROTO "Rod_A.proto"

PROTO SbEllicHalf [
#  field SFColor frameColor 0.8 0.8 0.8
#  field SFColor crankColor 0.2 0.2 0.2
]
{
  Robot {
    controller "ellic_controller"

    children [

      # === FRAME (offset of pivot)===
      Frame {
        color IS frameColor
        translation 0.3545 0.206 0
      }

      # === CRANK JOINT ===
      HingeJoint {
        jointParameters HingeJointParameters {
          anchor 0 0 0
          axis 0 0 1
        }

        device [
          RotationalMotor {
            name "crank_motor"
            maxVelocity 10
          }
          PositionSensor {
            name "crank_sensor"
          }
        ]

          endPoint Solid {
            name "crank_with_rod"

            children [

            # === сам crank ===
            Crank {
                color IS crankColor
            }

            # === соединение crank → Rod_A ===
            HingeJoint {
                jointParameters HingeJointParameters {
                anchor 0.175 0 0   # конец кривошипа (если 0.175 длина)
                axis 0 0 1
                }

                endPoint Rod_A {
                }
            }
        ]

            physics Physics {
            mass 0.2
            density -1
            }
        }
    }]
  }
}