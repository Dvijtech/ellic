#VRML_SIM R2023b utf8

EXTERNPROTO "Frame.proto"
EXTERNPROTO "Crank.proto"

PROTO SbEllicHalf [
]
{
  Robot {
    controller "ellic_controller"

    children [
        # === FRAME (визуал + физика) ===
        Frame {
            translation 0 0 0
            rotation 0 0 1 0.527
        }

        # === CRANK JOINT (в конце фрейма) ===
        HingeJoint {
        jointParameters HingeJointParameters {
            anchor 0 0 0
            axis 0 0 -1
        }
        device [
            RotationalMotor {
            name "crank_motor"
            maxVelocity 10
            }
            PositionSensor {
            name "crank_sensor"
            }
        ]
        endPoint Crank {}
        }
    ]
  }
}