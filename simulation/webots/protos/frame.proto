#VRML_SIM R2023b utf8

PROTO Frame [
  field SFColor color 0.2 0.8 0.8
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
]
{
  Solid {
    name "frame"

    translation IS translation
    rotation IS rotation

    children [
      Transform {
        translation 0.4085 0 0   # половина длины, чтобы начало было в (0,0,0)

        children [
          Shape {
            appearance Appearance {
              material Material {
                diffuseColor IS color
              }
            }
            geometry Box {
              size 0.817 0.03 0.03
            }
          }
        ]
      }
    ]

    boundingObject Box {
      size 0.817 0.03 0.03
    }

    physics Physics {
      mass 5
      density -1
    }
  }
}