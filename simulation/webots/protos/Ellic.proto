#VRML_SIM R2023b utf8

# One-side Ellic with crank–rod–slider–wheel (open loop for Webots)
# Active DOF: crank_motor (hinge). Slider and wheel are driven from controller.

PROTO Ellic [
  field SFVec3f    translation 0 0.3 0
  field SFRotation rotation 0 1 0 0
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    controller "ellic_controller"

    children [
      # ================= FRAME =================
      Solid {
        name "frame"
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.2 0.2 0.2 }
            geometry Box { size 0.8 0.08 0.3 }
          }
        ]
        boundingObject Box { size 0.8 0.08 0.3 }
        physics Physics { mass 5 }
      }

      # ================= CRANK =================
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0 0 0
        }
        device [
          RotationalMotor { name "crank_motor" maxVelocity 20 }
          PositionSensor { name "crank_sensor" }
        ]
        endPoint Solid {
          name "crank"
          translation 0 0 0
          children [
            Shape {
              appearance PBRAppearance { baseColor 1 1 0 }
              geometry Cylinder { radius 0.04 height 0.06 }
            }
          ]
          boundingObject Cylinder { radius 0.04 height 0.06 }
          physics Physics { mass 0.5 }
        }
      }

      # ================= SLIDER (CARRIAGE) =================
      SliderJoint {
        jointParameters JointParameters {
          axis 1 0 0
          minPosition -0.6
          maxPosition 0.6
        }
        device [
          LinearMotor { name "slider_motor" maxVelocity 5 }
          PositionSensor { name "slider_sensor" }
        ]
        endPoint Solid {
          name "carriage"
          translation 0.2 0 0
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.0 0.6 1.0 }
              geometry Box { size 0.18 0.06 0.18 }
            }

            # ============== WHEEL (mounted on carriage) ==============
            HingeJoint {
              jointParameters HingeJointParameters {
                axis 0 0 1
                anchor 0 0 0
              }
              device [
                RotationalMotor { name "wheel_motor" maxVelocity 50 }
                PositionSensor { name "wheel_sensor" }
              ]
              endPoint Solid {
                name "wheel"
                translation 0 0 0
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.1 0.1 0.1 }
                    geometry Cylinder { radius 0.15 height 0.05 }
                  }
                ]
                boundingObject Cylinder { radius 0.15 height 0.05 }
                physics Physics { mass 1 }
              }
            }
          ]
          boundingObject Box { size 0.18 0.06 0.18 }
          physics Physics { mass 1 }
        }
      }

      # ================= ROD (visual link crank -> wheel axis) =================
      # Open-loop visual element; its pose will be updated in controller if needed
      Solid {
        name "rod_visual"
        translation 0.1 0 0
        children [
          Shape {
            appearance PBRAppearance { baseColor 1 0 0 }
            geometry Box { size 0.4 0.03 0.03 }
          }
        ]
      }

      # ================= HAND LEVER (visual, optional control) =================
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor -0.2 0.15 0
        }
        device [ RotationalMotor { name "hand_motor" maxVelocity 10 } ]
        endPoint Solid {
          name "hand"
          translation -0.2 0.15 0
          children [
            Shape {
              appearance PBRAppearance { baseColor 0 1 0 }
              geometry Box { size 0.04 0.35 0.04 }
            }
          ]
        }
      }
    ]
  }
}
